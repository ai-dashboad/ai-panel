server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-panel-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service
        - id: user-service
          uri: lb://ai-panel-user
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/admin/**, /api/v1/webhook/**
          filters:
            - StripPrefix=0

        # API Key Service
        - id: key-service
          uri: lb://ai-panel-key
          predicates:
            - Path=/api/v1/keys/**
          filters:
            - StripPrefix=0

        # Model Dispatch Service (includes models, groups, chat, completions, embeddings)
        - id: dispatch-service
          uri: lb://dispatch-service
          predicates:
            - Path=/api/v1/chat/**, /api/v1/completions/**, /api/v1/embeddings/**, /api/v1/models/**, /api/v1/model-groups/**, /api/v1/stats/**
          filters:
            - StripPrefix=0

        # Billing Service
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/billing/**, /api/v1/usage/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-RateLimit-Limit
              - X-RateLimit-Remaining
              - X-RateLimit-Reset
              - X-Request-ID

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT Configuration (must match ai-panel-user)
jwt:
  secret: ${JWT_SECRET}

# Apollo Configuration
app:
  id: ${spring.application.name}
apollo:
  meta: http://${APOLLO_META:localhost:8080}
  bootstrap:
    enabled: ${APOLLO_ENABLED:false}
    namespaces: application

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.aipanel.gateway: DEBUG
