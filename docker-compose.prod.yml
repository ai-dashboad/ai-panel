version: '3.8'

services:
  # MySQL Database Cluster
  mysql-primary:
    image: mysql:8.0
    container_name: ai-panel-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ai_panel_user
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --server-id=1 --log-bin=mysql-bin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # Redis Cluster
  redis:
    image: redis:7-alpine
    container_name: ai-panel-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # Eureka Service Registry (HA - 2 instances)
  eureka-1:
    image: ${DOCKER_REGISTRY}/ai-panel-eureka:${VERSION:-latest}
    container_name: ai-panel-eureka-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_INSTANCE_HOSTNAME: eureka-1
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-2:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M

  eureka-2:
    image: ${DOCKER_REGISTRY}/ai-panel-eureka:${VERSION:-latest}
    container_name: ai-panel-eureka-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_INSTANCE_HOSTNAME: eureka-2
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?set EUREKA_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-1:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M

  # API Gateway (Load balanced - 2 instances)
  gateway:
    image: ${DOCKER_REGISTRY}/ai-panel-gateway:${VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/
      REDIS_HOST: redis
      MYSQL_HOST: mysql-primary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 random bytes)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env (comma-separated UI origins)}
    depends_on:
      - eureka-1
      - eureka-2
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  # Microservices
  user-service:
    image: ${DOCKER_REGISTRY}/ai-panel-user:${VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/
      REDIS_HOST: redis
      MYSQL_HOST: mysql-primary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 random bytes)}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  key-service:
    image: ${DOCKER_REGISTRY}/ai-panel-key:${VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/
      REDIS_HOST: redis
      MYSQL_HOST: mysql-primary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  dispatch-service:
    image: ${DOCKER_REGISTRY}/ai-panel-dispatch:${VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/
      REDIS_HOST: redis
      MYSQL_HOST: mysql-primary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env (comma-separated UI origins)}
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G

  billing-service:
    image: ${DOCKER_REGISTRY}/ai-panel-billing:${VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/
      REDIS_HOST: redis
      MYSQL_HOST: mysql-primary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  # Frontend with Nginx
  ui:
    image: ${DOCKER_REGISTRY}/ai-panel-ui:${VERSION:-latest}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ai-panel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - ui

volumes:
  mysql_primary_data:
  redis_data:

networks:
  default:
    name: ai-panel-network
