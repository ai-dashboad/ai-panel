name = "ai-panel-key"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-panel-key"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KEY_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true

# Set the real secrets with:
#   npx wrangler secret put JWT_SECRET          # must match ai-panel-user's jwt.secret
#   npx wrangler secret put INTERNAL_API_TOKEN  # sent by callers of /validate and /internal/validate
