name = "ai-panel-model"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-panel-model"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Admins: tokens with the role=ADMIN claim (t_user.role in ai-panel-user) are always
# admins. Usernames listed here (comma-separated, JWT "username" claim) are admins too,
# which helps when the workers run without the Spring user service.
ADMIN_USERNAMES = "admin"

[observability]
enabled = true

# Set the real secret with:
#   npx wrangler secret put JWT_SECRET
# It must match the `jwt.secret` value configured for ai-panel-user.
